apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: bitwarden-selfsigned
  namespace: external-secrets
spec:
  selfSigned: {}
---
# Long-lived trust anchor. The SDK server leaf renews below; this CA does not
# rotate on every leaf renewal, so the ClusterSecretStore caProvider stays valid.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: bitwarden-ca
  namespace: external-secrets
spec:
  secretName: bitwarden-ca
  isCA: true
  duration: 87600h   # 10 years
  renewBefore: 720h  # 30 days
  subject:
    organizations:
      - external-secrets-bitwarden
  commonName: bitwarden-sdk-server-ca
  issuerRef:
    name: bitwarden-selfsigned
    kind: Issuer
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: bitwarden-ca-issuer
  namespace: external-secrets
spec:
  ca:
    secretName: bitwarden-ca
---
# Server leaf. ca.crt in this secret is the stable CA above.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: bitwarden-tls-certs
  namespace: external-secrets
spec:
  secretName: bitwarden-tls-certs
  duration: 2160h   # 90 days
  renewBefore: 720h # 30 days
  subject:
    organizations:
      - external-secrets-bitwarden
  commonName: bitwarden-sdk-server
  dnsNames:
    - bitwarden-sdk-server.external-secrets.svc.cluster.local
    - bitwarden-sdk-server.external-secrets.svc
    - localhost
  ipAddresses:
    - 127.0.0.1
  issuerRef:
    name: bitwarden-ca-issuer
    kind: Issuer
