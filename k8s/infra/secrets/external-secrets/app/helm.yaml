apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets
spec:
  interval: 10m
  targetNamespace: external-secrets
  chart:
    spec:
      chart: external-secrets
      version: "2.14.0"
      sourceRef:
        kind: HelmRepository
        name: external-secrets
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  values:
    bitwarden-sdk-server:
      enabled: true
      image:
        # Chart 2.14.0 pins the subchart at v0.6.0; run the latest SDK server.
        tag: "v0.8.1"
      podAnnotations:
        # Reloader restarts the SDK server when cert-manager renews the
        # bitwarden-tls-certs secret (the process does not hot-reload TLS).
        secret.reloader.stakater.com/reload: "bitwarden-tls-certs"
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: external-secrets
spec:
  interval: 1h
  url: https://charts.external-secrets.io
