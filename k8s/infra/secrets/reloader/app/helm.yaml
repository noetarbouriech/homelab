apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: stakater
  namespace: reloader
spec:
  interval: 1h
  url: https://stakater.github.io/stakater-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: reloader
  namespace: reloader
spec:
  interval: 10m
  targetNamespace: reloader
  chart:
    spec:
      chart: reloader
      version: "2.2.19"
      sourceRef:
        kind: HelmRepository
        name: stakater
        namespace: reloader
      interval: 1h
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  values:
    reloader:
      # Cluster-wide watch; only workloads with the reload annotation are
      # restarted, so this does not touch anything else.
      watchGlobally: true
      reloadOnCreate: false
      reloadOnDelete: false
      syncAfterRestart: false
      logLevel: info
