apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: trust-manager-bundles
spec:
  interval: 10m
  prune: true
  wait: true

  path: ./k8s/infra/networking/cert-manager/trust-manager-bundles
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system

  dependsOn:
    - name: trust-manager
