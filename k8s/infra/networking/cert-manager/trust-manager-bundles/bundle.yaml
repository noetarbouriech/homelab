# Publishes the CA certificate as ConfigMap "crafty-ca" (key ca.crt) into the
# games namespace. Cilium's BackendTLSPolicy reads its trust anchor from exactly
# that shape, and trust-manager keeps the ConfigMap in sync if the CA rotates.
#
# The namespaceSelector uses Kubernetes' own namespace label, so no extra
# labelling of the games namespace is needed.
#
# This lives in its own Flux Kustomization (trust-manager-bundles) because the
# Bundle CRD only exists once the trust-manager HelmRelease has been installed;
# applying both in one pass fails the dry-run for the unknown kind.
apiVersion: trust.cert-manager.io/v1alpha1
kind: Bundle
metadata:
  name: crafty-ca
  namespace: cert-manager
spec:
  sources:
    - secret:
        name: crafty-ca-tls
        key: ca.crt
  target:
    configMap:
      key: ca.crt
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: games
