# A private CA for in-cluster TLS hops, so services do not have to depend on
# public ACME to talk TLS to each other.
#
# Why not Let's Encrypt for the games panel: mc.home.noe-t.dev sits under the
# *.home.noe-t.dev wildcard, and DNS-01 challenges for names under that wildcard
# cannot be published through the current Porkbun integration (the record lands
# in Porkbun's API but the authoritative zone never serves it). A private CA
# removes that dependency entirely.
#
# The CA Secret must live in the trust-manager namespace (cert-manager), because
# a Bundle can only read sources from its own namespace.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: homelab-selfsigned
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: crafty-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: crafty-internal-ca
  secretName: crafty-ca-tls
  duration: 87600h    # 10 years
  renewBefore: 8760h
  privateKey:
    algorithm: RSA
    size: 2048
  issuerRef:
    name: homelab-selfsigned
    kind: ClusterIssuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: crafty-ca
spec:
  ca:
    secretName: crafty-ca-tls
