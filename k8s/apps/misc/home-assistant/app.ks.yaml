apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: home-assistant
spec:
  interval: 10m
  prune: true
  wait: true

  path: ./k8s/apps/misc/home-assistant/app
  targetNamespace: iot
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system

  dependsOn:
    - name: infra
      namespace: flux-system
