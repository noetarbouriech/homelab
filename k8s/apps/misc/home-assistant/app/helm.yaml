apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: pajikos
  namespace: iot
spec:
  interval: 1h
  url: https://pajikos.github.io/home-assistant-helm-chart/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: home-assistant
  namespace: iot
spec:
  interval: 1h
  install:
    disableWait: true

  upgrade:
    disableWait: true
  chart:
    spec:
      chart: home-assistant
      version: "0.3.90"
      sourceRef:
        kind: HelmRepository
        name: pajikos
        namespace: iot
      interval: 1h
  values:
    startupProbe:
      httpGet:
        path: /
        port: http
        scheme: HTTP
      failureThreshold: 60
      periodSeconds: 5
      timeoutSeconds: 2
    hostNetwork: true
    dnsPolicy: ClusterFirstWithHostNet
    image:
      repository: ghcr.io/home-assistant/home-assistant
      tag: "2026.11.0"
      pullPolicy: IfNotPresent
    controller:
      type: StatefulSet
    replicaCount: 1
    podSecurityContext:
      runAsUser: 568
      runAsGroup: 568
      fsGroup: 568
      fsGroupChangePolicy: OnRootMismatch
    env:
      - name: TZ
        value: Europe/Paris
    service:
      type: ClusterIP
      port: 8123
    httpRoute:
      enabled: true
      parentRefs:
        - name: cilium-gateway
          namespace: kube-system
          sectionName: https
      hostnames:
        - home-assistant.home.noe-t.dev
    persistence:
      enabled: true
      size: 10Gi
      storageClass: "piraeus-replicated"
    configuration:
      enabled: true
      forceInit: true
      trusted_proxies:
        - 10.40.0.0/24
      templateConfig: |-
        default_config:
        logger:
          default: warning
          logs:
            homeassistant.components.matter: debug
            homeassistant.components.thread: debug
            python_otbr_api: debug
        # HTTP settings (use_x_forwarded_for, trusted_proxies, port, ...) are
        # UI-managed in /config/.storage/http since HA 2026.8. The legacy
        # `http:` YAML block is ignored and breaks in 2027.2, so it must NOT
        # be added here. The chart seeds .storage/http on a fresh install from
        # configuration.trusted_proxies (see httpStorageTemplate).
        homeassistant:
          auth_providers:
            # Keep `homeassistant` first: the chart's forceInit step
            # deep-merges lists by index, and the live PVC already uses
            # this order. The ha-bootstrap Job selects trusted_networks
            # explicitly, so provider order does not matter for it.
            - type: homeassistant
            # Trusted for tooling (ha-bootstrap Job). Uses the POD network
            # (10.244.0.0/22), NOT node IPs: the trusted_networks provider
            # refuses addresses that are also in the HTTP trusted_proxies
            # (10.40.0.0/24 covers every node IP). Any stale node-IP entries
            # left on the PVC are inert (rejected as proxies).
            - type: trusted_networks
              trusted_networks:
                - 10.244.0.0/22
              allow_bypass_login: true
        frontend:
          themes: !include_dir_merge_named themes
        automation: !include automations.yaml
        script: !include scripts.yaml
        scene: !include scenes.yaml
      initScript: |-
        #!/bin/bash
        set -e

        # --- Default chart behavior: create/merge configuration.yaml and required includes ---
        if [ ! -f /config/configuration.yaml ]; then
          echo "Configuration file not found, creating a new one"
          cp /config-templates/configuration.yaml /config/configuration.yaml
          config_created="true"
        fi

        forceInit="{{ .Values.configuration.forceInit }}"
        if [ "$forceInit" = "true" ]; then
          echo "Force init is enabled, overwriting the configuration file"
          current_time=$(date +%Y%m%d_%H%M%S)
          echo "Backup the current configuration file to configuration.yaml.$current_time"
          cp /config/configuration.yaml /config/configuration.yaml.$current_time

          echo "Cleaning up - keeping only 10 most recent backups..."
          ls -t /config/configuration.yaml.* 2>/dev/null | tail -n +11 | xargs -r rm

          if [[ ! -s /config/configuration.yaml ]]; then
            cat /config-templates/configuration.yaml > /config/configuration.yaml
          else
            yq eval-all --inplace --header-preprocess=false 'select(fileIndex == 0) *d select(fileIndex == 1)' /config/configuration.yaml /config-templates/configuration.yaml
          fi
        fi

        # HA 2026.8+ migrated HTTP settings to /config/.storage/http; the legacy
        # `http:` block in configuration.yaml is ignored (and breaks in 2027.2).
        # Force-init merges keys but never deletes them, so drop the stale block
        # once the storage migration exists. Guarded: on an older HA without
        # .storage/http the block is still needed for the one-time migration.
        if [ -f /config/.storage/http ] && [ "$(yq 'has("http")' /config/configuration.yaml 2>/dev/null)" = "true" ]; then
          echo "Removing legacy http: block from configuration.yaml (migrated to .storage/http)"
          if ! yq eval --inplace --header-preprocess=false 'del(.http)' /config/configuration.yaml; then
            echo "WARNING: could not remove the http: block; remove it manually"
          fi
        fi

        # Seed /config/.storage/http on a genuinely fresh install (chart 0.3.75+).
        # Existing storage is never overwritten, so UI-managed settings win.
        if [ "$config_created" = "true" ] && [ -f /config-templates/http-storage.json ] && [ ! -f /config/.storage/http ]; then
          has_http=$(yq 'has("http")' /config/configuration.yaml 2>/dev/null) || has_http="unknown"
          if [ "$has_http" = "false" ]; then
            echo "Seeding /config/.storage/http with the reverse proxy configuration"
            mkdir -p /config/.storage
            if yq -o=json '.data.stable.created_at = now' /config-templates/http-storage.json > /config/.storage/http.tmp; then
              mv /config/.storage/http.tmp /config/.storage/http
            else
              echo "WARNING: could not render /config/.storage/http, configure the http settings from the UI"
              rm -f /config/.storage/http.tmp
            fi
          fi
        fi

        if [ ! -f /config/automations.yaml ]; then
          echo "Automations file not found, creating a new one"
          touch /config/automations.yaml
          echo "[]" >> /config/automations.yaml
        fi

        if [ ! -f /config/scripts.yaml ]; then
          echo "Scripts file not found, creating a new one"
          touch /config/scripts.yaml
        fi

        if [ ! -f /config/scenes.yaml ]; then
          echo "Scenes file not found, creating a new one"
          touch /config/scenes.yaml
        fi

        # --- HACS is built into Home Assistant as the Marketplace since 2026.11 ---
        # HA's HACS migration removes /config/custom_components/hacs on first
        # start. Do not reinstall the old HACS here: it would fight the migration
        # and the standalone HACS installer no longer ships for 2026.11+.
        # The migration cannot delete the wrapper directory because the parent
        # custom_components is root-owned and not group-writable; remove the
        # empty leftover so it is never picked up as an integration.
        if [ -d /config/custom_components/hacs ] && [ ! -f /config/custom_components/hacs/manifest.json ]; then
          rm -rf /config/custom_components/hacs || true
        fi

        # The Marketplace installs/updates custom integrations at runtime as
        # the HA user (568). On the PVC, custom_components is root-owned and
        # not group-writable, so make it writable by 568 once (this init runs
        # as root). Without this, Marketplace installs fail with EACCES.
        mkdir -p /config/custom_components
        chown 568:568 /config/custom_components
        chmod 2775 /config/custom_components

        # --- Custom addition: install Delta Dore Tydom custom component (pinned) ---
        TYDOM_VERSION="0.31"
        if [ ! -f /config/custom_components/deltadore_tydom/manifest.json ]; then
          mkdir -p /config/custom_components/deltadore_tydom
          wget -O /tmp/deltadore_tydom.zip \
            "https://github.com/CyrilP/hass-deltadore-tydom-component/releases/download/v${TYDOM_VERSION}/deltadore_tydom.zip"
          unzip -o /tmp/deltadore_tydom.zip \
            -d /config/custom_components/deltadore_tydom
          rm -f /tmp/deltadore_tydom.zip
          chown -R 568:568 /config/custom_components/deltadore_tydom
          test -f /config/custom_components/deltadore_tydom/manifest.json
        fi
