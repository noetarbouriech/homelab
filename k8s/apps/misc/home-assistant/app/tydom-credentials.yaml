# Delta Dore Tydom credentials — sourced from Bitwarden Secrets Manager.
#
# The ExternalSecret stays NotReady until these two items exist in the
# Bitwarden SM project referenced by the bitwarden-secretsmanager
# ClusterSecretStore (project acc89a8e-…):
#   - deltadore-tydom-email      (Delta Dore account email, Cloud mode)
#   - deltadore-tydom-password   (Delta Dore account password, Cloud mode)
# Once present, the secret "tydom-credentials" is synced into namespace iot.
# Consumed by the HA "Delta Dore Tydom" integration setup (runbook:
# docs/home-assistant.md). Gateway MAC/host are NOT secrets and live in the
# runbook, not here.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tydom-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-secretsmanager
    kind: ClusterSecretStore
  target:
    name: tydom-credentials
    creationPolicy: Owner
  data:
    - secretKey: email
      remoteRef:
        key: deltadore-tydom-email
    - secretKey: password
      remoteRef:
        key: deltadore-tydom-password
