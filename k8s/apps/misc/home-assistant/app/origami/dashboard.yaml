# Origami dashboard tailored to this home.
# Header: Origami Header menu, greeting, weather. Favorites: Bubble buttons.
# Rooms: Paper Buttons Row. House: Bubble/todo/weather. Navbar: Navbar Card.
title: Origami
views:
  - type: sections
    title: Home
    path: home
    icon: mdi:home-heart
    max_columns: 4
    dense_section_placement: false
    sections:
      # Header
      - type: grid
        column_span: 4
        cards:
          - type: custom:origami-header-card
            mode: menu
            position: top
            layout: grid
            all_users: true
            buttons:
              - name: Settings
                icon: mdi:cog-outline
                tap_action:
                  action: navigate
                  navigation_path: /config
              - name: Edit
                icon: mdi:pencil-outline
                special: edit
              - name: Menu
                icon: mdi:menu
                special: sidebar
            cards:
              type: custom:paper-buttons-row
              base_config:
                layout: name|state
                tooltip: false
              styles:
                padding: var(--ha-space-4)
                background-color: var(--ha-card-background)
                border-radius: var(--ha-card-border-radius)
                box-shadow: var(--ha-card-box-shadow)
              buttons:
                - entity: sensor.greetings
                  name: Hello, Noé
                  icon: mdi:weather-sunset-up
                - entity: sensor.climate_home
                  name: Home
                  icon: mdi:thermometer
                  state:
                    attribute: temperature_average
                    postfix: °
                - entity: sensor.lights_on_count
                  name: Lights
                  icon: mdi:lightbulb-on-outline
                - entity: sensor.windows_open_count
                  name: Windows
                  icon: mdi:window-closed-variant

          - type: custom:paper-buttons-row
            extra_styles: ':host { display: block; }'
            styles:
              flex-direction: column
              justify-content: center
              gap: var(--ha-space-1)
              padding: var(--ha-space-3) var(--ha-space-4)
            base_config:
              layout: state
              tap_action:
                action: none
              styles:
                button:
                  min-height: unset
                  padding: 0px
                  align-self: flex-start
                  justify-content: flex-start
                  pointer-events: none
                state:
                  padding: 0px
            buttons:
              - entity: calendar.poubelles_toulouse_metropole
                state:
                  attribute: message
                styles:
                  state:
                    font-size: var(--ha-font-size-s)
                    font-weight: var(--ha-font-weight-bold)
                    color: var(--secondary-text-color)
                    white-space: nowrap
                    overflow: hidden
                    text-overflow: ellipsis
                    max-width: 220px
              - entity: sensor.greetings
                styles:
                  state:
                    font-size: var(--ha-font-size-l)
                    font-weight: var(--ha-font-weight-bold)
                    white-space: nowrap

          - type: custom:origami-weather
            weather_entity: weather.forecast_home
            sun_enabled: false
            moon_enabled: false
            color_mode: theme
            card_height: 160px
            card_padding: 20px
            card_offset: 16px 0px 12px 0px
            background_mode: color
            background_threshold_entity: weather.forecast_home
            background_thresholds:
              - value: sunny
                color: '#e7e2d9'
                color_dark: '#24211d'
              - value: clear-night
                color: '#24211d'
                color_dark: '#181715'
              - value: partlycloudy
                color: '#d9d5cc'
                color_dark: '#2a2723'
              - value: cloudy
                color: '#c9c5bc'
                color_dark: '#322e29'
              - value: rainy
                color: '#b8c4c8'
                color_dark: '#263033'
              - value: pouring
                color: '#a7b7bd'
                color_dark: '#202a2d'
              - value: snowy
                color: '#eef0ee'
                color_dark: '#2b2e2c'
              - value: fog
                color: '#d3d0c8'
                color_dark: '#302c27'
              - value: windy
                color: '#d0cec6'
                color_dark: '#2c2a25'

      # Favorites: Bubble button cards, no custom modules
      - type: grid
        column_span: 4
        cards:
          - type: custom:bubble-card
            card_type: separator
            name: Favorites
            modules:
              - origami_header
            origami_header:
              icon_size: var(--icon-size-m)
            grid_options:
              columns: full
              rows: auto
            sub_button:
              main:
                - name: House
                  icon: mdi:home-city
                  show_name: true
                  content_layout: icon-right
                  tap_action:
                    action: navigate
                    navigation_path: '#house'
          - type: grid
            square: false
            columns: 2
            cards:
              - type: custom:bubble-card
                card_type: button
                button_type: switch
                entity: light.living_room_lampe_lecture
                name: Reading
                icon: mdi:lamp
                show_state: true
                tap_action:
                  action: toggle
              - type: custom:bubble-card
                card_type: button
                button_type: switch
                entity: light.living_room_prise_salon
                name: Donut
                icon: mdi:lightbulb
                show_state: true
                tap_action:
                  action: toggle
              - type: custom:bubble-card
                card_type: button
                button_type: switch
                entity: light.living_room_lumiere_entree
                name: Entrance
                icon: mdi:lightbulb
                show_state: true
                tap_action:
                  action: toggle
              - type: custom:bubble-card
                card_type: button
                button_type: switch
                entity: climate.split_sejour
                name: Split
                icon: mdi:air-conditioner
                show_state: true
                tap_action:
                  action: more-info
              - type: custom:bubble-card
                card_type: button
                button_type: switch
                entity: climate.radiateurs
                name: Radiator
                icon: mdi:radiator
                show_state: true
                tap_action:
                  action: more-info
              - type: custom:bubble-card
                card_type: button
                entity: cover.baie_sejour
                name: Bay
                icon: mdi:window-shutter
                show_state: true
                tap_action:
                  action: more-info
              - type: custom:bubble-card
                card_type: button
                entity: cover.chambre
                name: Bedroom
                icon: mdi:window-shutter
                show_state: true
                tap_action:
                  action: more-info
              - type: custom:bubble-card
                card_type: button
                entity: cover.all_shutters
                name: All
                icon: mdi:window-shutter
                show_state: true
                tap_action:
                  action: more-info

      # Rooms
      - type: grid
        column_span: 4
        cards:
          - type: custom:bubble-card
            card_type: separator
            name: Rooms
            modules:
              - origami_header
            origami_header:
              value_style: chip
              icon_size: var(--icon-size-l)
            grid_options:
              columns: full
              rows: auto
            sub_button:
              main:
                - name: Temperature
                  entity: sensor.climate_home
                  icon: mdi:thermometer
                  origami_header:
                    name: '${attr.temperature_average}°'
                  tap_action:
                    action: more-info
          - type: grid
            square: false
            columns: 2
            cards:
              - type: custom:bubble-card
                card_type: button
                button_type: switch
                entity: climate.split_sejour
                name: Living Room
                icon: mdi:sofa
                show_state: true
                tap_action:
                  action: navigate
                  navigation_path: '#living-room'
              - type: custom:bubble-card
                card_type: button
                button_type: switch
                entity: climate.radiateurs
                name: Bedroom
                icon: mdi:bed
                show_state: true
                tap_action:
                  action: navigate
                  navigation_path: '#bedroom'
              - type: custom:bubble-card
                card_type: button
                entity: alarm_control_panel.tyxal_alarm
                name: Entrance
                icon: mdi:door
                show_state: true
                tap_action:
                  action: navigate
                  navigation_path: '#entrance'

      # House
      - type: grid
        column_span: 4
        cards:
          - type: custom:bubble-card
            card_type: separator
            name: House
            modules:
              - origami_header
            origami_header:
              icon_size: var(--icon-size-l)
            grid_options:
              columns: full
              rows: auto
          - type: custom:bubble-card
            card_type: cover
            entity: cover.all_shutters
            name: All shutters
            icon: mdi:window-shutter
            modules:
              - origami_base
            grid_options:
              columns: full
              rows: auto
          - type: custom:bubble-card
            card_type: calendar
            entities:
              - entity: calendar.poubelles_toulouse_metropole
            modules:
              - origami_base
            grid_options:
              columns: full
              rows: auto
          - type: custom:bubble-card
            card_type: button
            entity: sensor.poubelles_dechets_recyclables
            name: Recyclables
            icon: mdi:recycle
            modules:
              - origami_base
            tap_action:
              action: more-info
            grid_options:
              columns: 6
              rows: auto
          - type: custom:bubble-card
            card_type: button
            entity: sensor.poubelles_dechets_non_recyclables
            name: Non-recyclables
            icon: mdi:trash-can
            modules:
              - origami_base
            tap_action:
              action: more-info
            grid_options:
              columns: 6
              rows: auto
          - type: todo-list
            entity: todo.shopping_list
            grid_options:
              columns: full
              rows: auto
          - type: weather-forecast
            entity: weather.forecast_home
            forecast_type: daily
            grid_options:
              columns: full
              rows: auto

      # Navbar
      - type: grid
        column_span: 4
        cards:
          - type: custom:paper-buttons-row
            base_config:
              layout: icon
              styles:
                button:
                  min-height: 120px
                  pointer-events: none
                icon:
                  --mdc-icon-size: 0px
            buttons:
              - icon: mdi:backspace-reverse
          - type: custom:navbar-card
            routes:
              - label: Home
                icon: mdi:home
                tap_action:
                  action: navigate
                  navigation_path: /origami-lite
              - label: Living
                icon: mdi:sofa
                tap_action:
                  action: navigate
                  navigation_path: '#living-room'
              - label: Bedroom
                icon: mdi:bed
                tap_action:
                  action: navigate
                  navigation_path: '#bedroom'
              - label: Entrance
                icon: mdi:door
                tap_action:
                  action: navigate
                  navigation_path: '#entrance'
              - label: House
                icon: mdi:home-city
                tap_action:
                  action: navigate
                  navigation_path: '#house'
              - label: More
                icon: mdi:dots-horizontal
                tap_action:
                  action: fire-dom-event
                  origami_header: toggle
            mobile:
              mode: floating
              show_labels: popup_only
            desktop:
              position: right
              mode: floating
              min_width: 700
              show_labels: popup_only
            haptic:
              url: false
              tap_action: true
            layout:
              reflect_child_state: true
              auto_padding:
                enabled: true
                mobile_px: 100

      # Pop-ups
      - type: grid
        column_span: 1
        cards:
          - type: custom:bubble-card
            card_type: pop-up
            hash: '#living-room'
            name: Living Room
            icon: mdi:sofa
            button_type: name
            show_header: true
            show_name: true
            show_icon: false
            card_layout: large
            scrolling_effect: false
            modules:
              - origami_popup
            cards:
              - type: vertical-stack
                cards:
                  - type: custom:bubble-card
                    card_type: button
                    button_type: switch
                    entity: climate.split_sejour
                    name: Split
                    icon: mdi:air-conditioner
                    modules:
                      - origami_base
                      - origami_climate
                    origami_base:
                      tile: true
                    tap_action:
                      action: more-info
                  - type: custom:bubble-card
                    card_type: cover
                    entity: cover.baie_sejour
                    name: Bay
                    icon: mdi:window-shutter
                    modules:
                      - origami_base
                  - type: custom:bubble-card
                    card_type: button
                    button_type: switch
                    entity: light.living_room_lampe_lecture
                    name: Reading
                    icon: mdi:lamp
                    modules:
                      - origami_base
                      - origami_light
                    origami_base:
                      tile: true
                    tap_action:
                      action: more-info
                  - type: custom:bubble-card
                    card_type: button
                    button_type: switch
                    entity: light.living_room_prise_salon
                    name: Donut
                    icon: mdi:lightbulb
                    modules:
                      - origami_base
                      - origami_light
                    origami_base:
                      tile: true
                    tap_action:
                      action: more-info

          - type: custom:bubble-card
            card_type: pop-up
            hash: '#bedroom'
            name: Bedroom
            icon: mdi:bed
            button_type: name
            show_header: true
            show_name: true
            show_icon: false
            card_layout: large
            scrolling_effect: false
            modules:
              - origami_popup
            cards:
              - type: vertical-stack
                cards:
                  - type: custom:bubble-card
                    card_type: button
                    button_type: switch
                    entity: climate.radiateurs
                    name: Radiator
                    icon: mdi:radiator
                    modules:
                      - origami_base
                      - origami_climate
                    origami_base:
                      tile: true
                    tap_action:
                      action: more-info
                  - type: custom:bubble-card
                    card_type: cover
                    entity: cover.chambre
                    name: Shutter
                    icon: mdi:window-shutter
                    modules:
                      - origami_base
                  - type: custom:bubble-card
                    card_type: button
                    button_type: switch
                    entity: switch.living_room_plug_2
                    name: Plug
                    icon: mdi:power-socket-eu
                    modules:
                      - origami_base
                    tap_action:
                      action: toggle

          - type: custom:bubble-card
            card_type: pop-up
            hash: '#entrance'
            name: Entrance
            icon: mdi:door
            button_type: name
            show_header: true
            show_name: true
            show_icon: false
            card_layout: large
            scrolling_effect: false
            modules:
              - origami_popup
            cards:
              - type: vertical-stack
                cards:
                  - type: custom:bubble-card
                    card_type: button
                    button_type: switch
                    entity: light.living_room_lumiere_entree
                    name: Light
                    icon: mdi:lightbulb
                    modules:
                      - origami_base
                      - origami_light
                    origami_base:
                      tile: true
                    tap_action:
                      action: more-info
                  - type: alarm-panel
                    entity: alarm_control_panel.tyxal_alarm
                    states:
                      - arm_home
                      - arm_away
                      - disarmed
                  - type: custom:bubble-card
                    card_type: button
                    entity: binary_sensor.living_room_movement_sensor_occupancy
                    name: Movement
                    icon: mdi:motion-sensor
                    modules:
                      - origami_base
                    tap_action:
                      action: more-info

          - type: custom:bubble-card
            card_type: pop-up
            hash: '#house'
            name: House
            icon: mdi:home-city
            button_type: name
            show_header: true
            show_name: true
            show_icon: false
            card_layout: large
            scrolling_effect: false
            modules:
              - origami_popup
            cards:
              - type: vertical-stack
                cards:
                  - type: custom:bubble-card
                    card_type: cover
                    entity: cover.all_shutters
                    name: All shutters
                    icon: mdi:window-shutter
                    modules:
                      - origami_base
                  - type: custom:bubble-card
                    card_type: button
                    entity: person.noe
                    name: Noé
                    icon: mdi:account
                    modules:
                      - origami_base
                    tap_action:
                      action: more-info
                  - type: custom:bubble-card
                    card_type: calendar
                    entities:
                      - entity: calendar.poubelles_toulouse_metropole
                    modules:
                      - origami_base
                  - type: weather-forecast
                    entity: weather.forecast_home
                    forecast_type: daily
                  - type: todo-list
                    entity: todo.shopping_list
