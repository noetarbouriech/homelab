      # Navbar (Navbar Card)
      - type: grid
        column_span: 2
        cards:
          - type: custom:paper-buttons-row
            base_config:
              layout: icon
              styles:
                button:
                  min-height: 120px
                  pointer-events: none
                icon:
                  --mdc-icon-size: 0px
            buttons:
              - icon: mdi:backspace-reverse
          - type: custom:navbar-card
            routes:
              - label: Home
                icon: mdi:home
                tap_action:
                  action: navigate
                  navigation_path: /origami-lite
              - label: Living
                icon: mdi:sofa
                tap_action:
                  action: navigate
                  navigation_path: '#living-room'
              - label: Bedroom
                icon: mdi:bed
                tap_action:
                  action: navigate
                  navigation_path: '#bedroom'
              - label: Entrance
                icon: mdi:door
                tap_action:
                  action: navigate
                  navigation_path: '#entrance'
              - label: House
                icon: mdi:home-city
                tap_action:
                  action: navigate
                  navigation_path: '#house'
              - label: More
                icon: mdi:dots-horizontal
                tap_action:
                  action: fire-dom-event
                  origami_header: toggle
                badge:
                  show: "[[[ return !!user?.is_admin && Object.keys(states).some(id => id.startsWith('update.') && states[id].state === 'on'); ]]]"
            mobile:
              mode: floating
              show_labels: popup_only
            desktop:
              position: right
              mode: floating
              min_width: 700
              show_labels: popup_only
            haptic:
              url: false
              tap_action: true
            layout:
              reflect_child_state: true
              auto_padding:
                enabled: true
                mobile_px: 100

