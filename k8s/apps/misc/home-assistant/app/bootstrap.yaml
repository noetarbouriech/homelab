# One-shot bootstrap Job: creates the HA config entries for the Thread,
# Matter and Delta Dore Tydom integrations via HA's REST config-flow API.
#
# Authentication: HA runs with hostNetwork. Depending on where this pod is
# scheduled, HA sees its source as the pod IP (same node, trusted directly) or
# a node IP (cross-node Cilium SNAT; node IPs are inside HTTP trusted_proxies
# and rejected by trusted_networks). The script probes /auth/providers and only
# switches to `X-Forwarded-For: <pod IP>` when the provider is hidden. No
# long-lived token is ever created.
# Idempotent: entries that already exist are skipped.
#
# Re-run (after a HA PVC wipe, or to fix entries):
#   kubectl -n iot delete job ha-bootstrap
#   kubectl -n iot create job --from=job/ha-bootstrap ha-bootstrap-rerun
apiVersion: batch/v1
kind: Job
metadata:
  name: ha-bootstrap
  labels:
    app: ha-bootstrap
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 900
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: ha-bootstrap
    spec:
      restartPolicy: Never
      containers:
        - name: bootstrap
          image: python:3.12-slim
          imagePullPolicy: IfNotPresent
          command: ["python", "/opt/bootstrap/main.py"]
          env:
            - name: HA_URL
              value: "http://home-assistant:8123"
            - name: CLIENT_ID
              value: "https://home-assistant.home.noe-t.dev/"
            - name: TYDOM_HOST
              value: "10.40.0.101"
            - name: TYDOM_MAC
              value: "001A250A0A63"
            - name: MATTER_URL
              value: "ws://matter-server:5580/ws"
            # Sent as X-Forwarded-For only when the direct source is a
            # trusted proxy (cross-node SNAT); same-node traffic is direct.
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          volumeMounts:
            - name: script
              mountPath: /opt/bootstrap
            - name: creds
              mountPath: /creds
              readOnly: true
      volumes:
        - name: script
          configMap:
            name: ha-bootstrap-script
        - name: creds
          secret:
            secretName: tydom-credentials
            defaultMode: 0400
