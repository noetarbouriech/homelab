apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: crafty
spec:
  interval: 10m
  prune: true
  wait: true
  timeout: 10m

  path: ./k8s/apps/games/crafty/app
  targetNamespace: games
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system

  dependsOn:
    - name: infra
      namespace: flux-system
