# Without this, the Cilium Gateway would speak plaintext HTTP to Crafty, which
# has no HTTP listener at all. BackendTLSPolicy support landed in Cilium 1.20
# (that is why this repo pins >= 1.20.2).
#
# Crafty serves the cert-manager certificate from the games namespace, which
# chains to a public CA, so "System" is the trust anchor. Cilium accepts exactly
# one of wellKnownCACertificates / caCertificateRefs; the fallback, if this is
# ever rejected, is a ConfigMap holding a private CA plus caCertificateRefs.
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: crafty
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: crafty
  validation:
    hostname: mc.home.noe-t.dev
    wellKnownCACertificates: System
