# Without this, the Cilium Gateway would speak plaintext HTTP to Crafty, which
# has no HTTP listener at all. BackendTLSPolicy support landed in Cilium 1.20
# (that is why this repo pins >= 1.20.2).
#
# The trust anchor is the in-cluster CA. Cilium only accepts a ConfigMap here
# (single ref, key "ca.crt"); trust-manager publishes exactly that object into
# this namespace from the cert-manager Secret, and keeps it current if the CA
# rotates.
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: crafty
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: crafty
  validation:
    hostname: mc.home.noe-t.dev
    caCertificateRefs:
      - group: ""
        kind: ConfigMap
        name: crafty-ca
