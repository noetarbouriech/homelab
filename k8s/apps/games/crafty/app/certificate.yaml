# Crafty's web UI is HTTPS-only (no HTTP listener since 4.3.1) and it reads its
# certificate from <config_dir>/web/certs/commander.{cert,key}.pem at startup,
# skipping self-signed generation when both files already exist. So we mount a
# real certificate there instead of putting a proxy in front of it.
#
# Issued by the in-cluster CA (clusterIssuer crafty-ca, see
# k8s/infra/networking/cert-manager/trust-manager/ca.yaml) rather than by
# Let's Encrypt: DNS-01 challenges for names under the *.home.noe-t.dev
# wildcard cannot currently be published through the Porkbun integration, so
# nothing here depends on public ACME.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: crafty-panel
spec:
  secretName: crafty-panel-tls
  duration: 8760h        # 1 year
  renewBefore: 720h      # renew a month early
  privateKey:
    algorithm: RSA
    size: 2048
  issuerRef:
    name: crafty-ca
    kind: ClusterIssuer
    group: cert-manager.io
  dnsNames:
    - mc.home.noe-t.dev
