apiVersion: v1
kind: Service
metadata:
  name: crafty
  labels:
    app.kubernetes.io/name: crafty
    app.kubernetes.io/instance: crafty
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: crafty
    app.kubernetes.io/instance: crafty
  ports:
    - name: https
      port: 8443
      targetPort: https
      protocol: TCP
      appProtocol: https
---
# ClusterIP: None -> DNS returns the pod IP, so mc-router can reach any port a
# server listens on without declaring each one on a Service.
apiVersion: v1
kind: Service
metadata:
  name: crafty-headless
  labels:
    app.kubernetes.io/name: crafty
    app.kubernetes.io/instance: crafty
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: crafty
    app.kubernetes.io/instance: crafty
  ports:
    - name: minecraft
      port: 25565
      targetPort: 25565
      protocol: TCP
