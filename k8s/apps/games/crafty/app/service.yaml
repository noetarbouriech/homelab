# One LoadBalancer IP for everything a player or a browser needs.
#
#   * labels.type: public-lb      -> selected by both the CiliumLoadBalancerIPPool
#                                    (lb-pool) and the CiliumL2AnnouncementPolicy,
#                                    so the IP is handed out and ARP-announced
#                                    on the LAN.
#   * lbipam.cilium.io/ips        -> pins the address for stable DNS/bookmarks.
#                                    Cilium still requires a matching pool, which
#                                    the label above provides.
#   * externalTrafficPolicy       -> left at the default Cluster: "Local" is
#                                    incompatible with L2 announcement.
#
# The game ports are declared up front on purpose. Kubernetes Services cannot
# express port ranges, so enumerating 25565-25579 here is what lets you create a
# server entirely in the panel: pick the next free port, no commit needed.
# Beyond 15 servers (or for plugin web maps on 8123/8100) add a port here.
apiVersion: v1
kind: Service
metadata:
  name: crafty
  labels:
    app.kubernetes.io/name: crafty
    app.kubernetes.io/instance: crafty
    type: public-lb
  annotations:
    lbipam.cilium.io/ips: "10.40.1.5"
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: crafty
    app.kubernetes.io/instance: crafty
  ports:
    # Panel. appProtocol makes the Cilium Gateway use TLS towards this backend,
    # with the trust anchor supplied by the BackendTLSPolicy.
    - name: https
      port: 8443
      targetPort: https
      protocol: TCP
      appProtocol: https
    - name: mc-25565
      port: 25565
      targetPort: 25565
      protocol: TCP
    - name: mc-25566
      port: 25566
      targetPort: 25566
      protocol: TCP
    - name: mc-25567
      port: 25567
      targetPort: 25567
      protocol: TCP
    - name: mc-25568
      port: 25568
      targetPort: 25568
      protocol: TCP
    - name: mc-25569
      port: 25569
      targetPort: 25569
      protocol: TCP
    - name: mc-25570
      port: 25570
      targetPort: 25570
      protocol: TCP
    - name: mc-25571
      port: 25571
      targetPort: 25571
      protocol: TCP
    - name: mc-25572
      port: 25572
      targetPort: 25572
      protocol: TCP
    - name: mc-25573
      port: 25573
      targetPort: 25573
      protocol: TCP
    - name: mc-25574
      port: 25574
      targetPort: 25574
      protocol: TCP
    - name: mc-25575
      port: 25575
      targetPort: 25575
      protocol: TCP
    - name: mc-25576
      port: 25576
      targetPort: 25576
      protocol: TCP
    - name: mc-25577
      port: 25577
      targetPort: 25577
      protocol: TCP
    - name: mc-25578
      port: 25578
      targetPort: 25578
      protocol: TCP
    - name: mc-25579
      port: 25579
      targetPort: 25579
      protocol: TCP
    # Bedrock edition (optional — Crafty can host it, nothing uses it yet).
    - name: bedrock-19132
      port: 19132
      targetPort: 19132
      protocol: UDP
