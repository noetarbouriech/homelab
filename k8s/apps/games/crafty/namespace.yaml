apiVersion: v1
kind: Namespace
metadata:
  name: games
  labels:
    # Crafty runs non-root but keeps the image's root *group* (runAsGroup: 0 /
    # fsGroup: 0) for its permission model, so "baseline" is the right floor.
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/warn: baseline
