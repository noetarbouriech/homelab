apiVersion: apps/v1
kind: Deployment
metadata:
  name: mc-router
  labels:
    app.kubernetes.io/name: mc-router
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mc-router
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mc-router
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mc-router
          image: itzg/mc-router:v1.47.0
          args:
            - -port
            - "25565"
            - -api-binding
            - ":8080"
          ports:
            - name: minecraft
              containerPort: 25565
              protocol: TCP
            - name: api
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: minecraft
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
