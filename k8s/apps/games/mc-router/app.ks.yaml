apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: mc-router
spec:
  interval: 10m
  prune: true
  wait: true
  timeout: 5m

  path: ./k8s/apps/games/mc-router/app
  targetNamespace: games
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system

  dependsOn:
    - name: infra
      namespace: flux-system
